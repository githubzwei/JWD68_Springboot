<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/css :: css}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section id="culture-category" class="culture-category section">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up">
        <div class="section-title-container d-flex align-items-center justify-content-between">
            <h2>Create Major Form</h2>
        </div>
    </div>

    <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="row justify-content-center">

            <div class="col-lg-8 col-md-10">

                <div class="card shadow-sm border-0">

                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Edit Form</h4>
                    </div>

                    <div class="card-body">

                        <form th:action="@{/major/update}"
                              th:object="${majorObj}"
                              method="post">
                              
                              <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="majorName" class="form-label">
                                    Major Name
                                </label>

                                <input type="text"
                                       id="majorName"
                                       th:field="*{majorName}"
                                       class="form-control"
                                       placeholder="Enter major name">
                            </div>

                            <div class="mb-3">
                                <label for="marks" class="form-label">
                                    Marks
                                </label>

                                <input type="number"
                                       id="marks"
                                       th:field="*{marks}"
                                       class="form-control"
                                       placeholder="Enter marks">
                            </div>

                            <div class="text-end">
                                <button type="submit"
                                        class="btn btn-primary">
                                    Update
                                </button>

                                <button type="reset"
                                        class="btn btn-secondary">
                                    Reset
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/js :: js}"></div>

</body>

</html>
