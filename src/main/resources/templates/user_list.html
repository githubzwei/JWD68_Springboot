<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<h3>User List</h3>
	<p th:text="'Size : '+${#lists.size(users_list)}"></p>

	<div th:if="${#lists.size(users_list)} != 0">
	<ul>
		<li th:each="user :${users_list}" th:if="${user}=='Mg Mg'"
			th:text=${user}></li>
	</ul>
	</div>
<h3 th:text="${#lists.isEmpty(users_list)}"></h3>
	



</body>
</html>
